<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Mi Tienda</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script> 
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="row">
                <div class="col-6">
                    <div class="logo-title">
                        <img src="img/logo.png" alt="Logo" height="25px" />
                        <h1>Login & Registers</h1>
                    </div>
                </div>

                <div class="col-6">
                    <ul>
                        <li><a href="inicio.html">Inicio</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <!-- Content -->
    <main>
        <div class="row">
            <!-- Login -->
            <section class="col-6">
                <form id="login-form">
                    <h2>Iniciar sesión</h2>
                    
                    <label for="login-username">Nombre de usuario o correo</label>
                    <input type="text" id="login-username" name="username" autocomplete="username" required />

                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required />

                    <button type="submit">Entrar</button>
                </form>
            </section>
            <!-- Register -->
            <section class="col-6">
                <form id="register-form">
                    <h2>Registrarse</h2>

                    <label for="reg-name">Nombre completo</label>
                    <input type="text" id="reg-name" name="fullname" autocomplete="name" required />

                    <label for="reg-email">Correo electrónico</label>
                    <input type="email" id="reg-email" name="email" autocomplete="email" required />

                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" name="password" autocomplete="new-password" required />

                    <label for="reg-confirm-password">Confirmar contraseña</label>
                    <input type="password" id="reg-confirm-password" name="confirm_password" autocomplete="new-password" required />

                    <button type="submit">Registrarse</button>
                </form>
            </section>
        </div>s
    </main>

    <footer style="margin-top: 24px; margin-bottom: 16px; text-align: center; color: #9ca3af; font-size: 0.85rem;">
        <p>EA1 - Fullstack 2 - Benjamin Canales</p>
    </footer>

</body>
</html>
