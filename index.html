<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script> 
</head>
<body>
    <!-- Nav -->
    <nav>
        <div class="row">
            <div class="col-6">
                <div class="logo-title">
                    <img src="img/logo.png" alt="Logo" height="25px" />
                    <h1>Inicio</h1>
                </div>
            </div>

            <div class="col-6">
                <ul>
                    <li><a href="/inicio.html">Inicio</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="row">
    <!-- Login -->
    <div class="col-6">
        <h2>Iniciar sesión</h2>
        <form action="/login" method="POST">
            <label for="login-username">Nombre de usuario o correo</label>
            <input type="text" id="login-username" name="username" required />

            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" name="password" required />

            <button type="submit">Entrar</button>
        </form>
    </div>
    <!-- Register -->
    <div class="col-6">
        <h2>Registrarse</h2>
        <form action="/register" method="POST">
            <label for="reg-name">Nombre completo</label>
            <input type="text" id="reg-name" name="fullname" required />

            <label for="reg-email">Correo electrónico</label>
            <input type="email" id="reg-email" name="email" required />

            <label for="reg-password">Contraseña</label>
            <input type="password" id="reg-password" name="password" required />

            <label for="reg-confirm-password">Confirmar contraseña</label>
            <input type="password" id="reg-confirm-password" name="confirm_password" required />

            <button type="submit">Registrarse</button>
        </form>
    </div>

</body>
</html>
